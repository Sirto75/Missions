<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Paolo Sirtoli (paolo.sirtoli@gmail.com)" />
  <title>Active Space Missions Dashboard (Mar 2026)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --text-color:#f1f5f9;
      --link-bg:rgba(15,23,42,0.85);
      --link-hover:#2563eb;
      --link-border:rgba(255,255,255,0.2);
      --lagrange-color:#c084fc;
      --mars-color:#bc404f;
      --panel-bg: rgba(100,120,180,0.92);
      --panel-border: rgba(255,255,255,0.14);
      --star-color: rgba(255,255,255,0.8);
    }

    * { box-sizing: border-box; }

    body{
      margin:0; padding:0; overflow:hidden;
      background:#020617; color:var(--text-color);
      font-family:'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height:100vh; width:100vw;
    }

    /* ===== STARFIELD ===== */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--min-op, 0.2); transform: scale(1); }
      50% { opacity: var(--max-op, 1); transform: scale(1.4); }
    }

    /* ===== NEBULA BACKGROUND ===== */
    #nebula {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(30,20,80,0.45) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 70%, rgba(10,40,80,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 50% 30% at 60% 20%, rgba(50,10,60,0.25) 0%, transparent 70%);
    }

    h1.main-title{
      position:absolute; bottom:30px; left:30px; margin:0;
      font-family: 'Orbitron', monospace;
      font-weight:400; font-size:18px; color:rgba(255,255,255,0.55);
      z-index:100; pointer-events:none;
      letter-spacing: 0.05em;
    }

    .mission-count-badge {
      display: inline-block;
      margin-left: 14px;
      background: rgba(37,99,235,0.25);
      border: 1px solid rgba(37,99,235,0.5);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      color: rgba(147,197,253,0.9);
      vertical-align: middle;
      pointer-events: none;
    }

    /* ===== TOP BAR ===== */
    .topbar{
      position:fixed;
      top:14px; right:14px;
      z-index:10000;
      display:flex; gap:10px; align-items:center;
      background: rgba(2,6,23,0.75);
      border:1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 8px 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .topbar label{
      font-size:12px; color:rgba(255,255,255,0.6);
      font-weight: 500;
    }
    #langSelect{
      background: rgba(15,23,42,0.8);
      color: rgba(255,255,255,0.9);
      border:1px solid rgba(255,255,255,0.18);
      border-radius:10px;
      padding:6px 10px;
      font-weight:600;
      outline:none;
      cursor: pointer;
    }

    /* ===== 3D ENGINE ===== */
    .universe-stage{ perspective:15000px; width:100%; height:100%; position:relative; z-index:1; }
    .solar-plane{
      position:absolute; top:20vh; left:15vw;
      width:0; height:0;
      transform-style:preserve-3d;
      transform:rotateX(50deg);
    }

    .orbit-ring{
      position:absolute;
      border:1px solid rgba(255,255,255,0.3);
      border-radius:50%;
      top:0; left:0;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }
    .earth-orbit { border-color: rgba(75,144,255,0.3); }
    .mars-orbit { border-color: rgba(255,87,51,0.3); }

    .orbit-node{
      position:absolute;
      width:0; height:0;
      transform-style:preserve-3d;
      transform:rotateX(-50deg);
      z-index:50;
    }

    .celestial-body{
      position:absolute;
      border-radius:50%;
      background-size:cover;
      background-position:center;
      transform:translate(-50%,-50%);
      box-shadow: inset -4px -4px 12px rgba(0,0,0,0.55);
    }

    /* Planet self-rotation */
    .planet-spin {
      animation: planetSpin 20s linear infinite;
    }
    @keyframes planetSpin {
      from { background-position: 0% center; }
      to { background-position: 200% center; }
    }

    .planet-label{
      position:absolute;
      color:#fff;
      font-family: 'Orbitron', monospace;
      font-weight:600;
      font-size:11px;
      text-shadow:0 2px 4px #000;
      white-space:nowrap;
      text-transform:uppercase;
      letter-spacing: 0.08em;
      opacity: 0.8;
    }

    /* ===== CLUSTER PANELS ===== */
    .mission-cluster{
      position:absolute;
      display:flex;
      gap:5px;
      background: rgba(2,6,23,0.82);
      backdrop-filter: blur(12px);
      padding:10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    /* Cluster title */
    .cluster-title {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-bottom: 6px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      width: 100%;
      white-space: nowrap;
    }

    .grid-cluster{ display:grid; grid-template-columns: 1fr 1fr; }
	.grid-cluster{ display:grid; grid-template-columns: repeat(2, max-content); }	
    .col-cluster{ flex-direction:column; }

    .lagrange-panel{ border-color:rgba(192,132,252,0.3); background: rgba(20,8,35,0.88); }
    .earth-panel{ border-color: rgba(10,130,230,0.3); background: rgba(8,22,60,0.88); }
    .mars-panel{ border-color: rgba(188,64,79,0.3); background: rgba(40,8,8,0.88); }
    .lunar-panel{ border-color:rgba(148,163,184,0.3); background: rgba(12,18,35,0.92); }
    .lagrange-title{ color:var(--lagrange-color) !important; }

    /* ===== MISSION LINKS ===== */
    .mission-link{
      display:flex; align-items:center;
      background: rgba(15,23,42,0.7);
      color: var(--text-color);
      text-decoration:none;
      padding:5px 8px;
      border-radius:6px;
      font-size:13.5px;
      font-weight:500;
      border:1px solid rgba(255,255,255,0.1);
      transition: all .2s ease;
      white-space:nowrap;
      position: relative;
      overflow: hidden;
    }
    .mission-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      transform: translateX(-100%);
      transition: transform 0.4s ease;
    }
    .mission-link:hover::before {
      transform: translateX(100%);
    }

    /* Agency badge */
    .agency-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      margin-right: 5px;
      opacity: 0.85;
      flex-shrink: 0;
    }
    .agency-nasa { background: rgba(11,61,145,0.7); color: #93c5fd; border: 1px solid rgba(37,99,235,0.4); }
    .agency-esa  { background: rgba(0,100,60,0.7);  color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
    .agency-cnsa { background: rgba(150,0,0,0.7);   color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
    .agency-jaxa { background: rgba(100,0,120,0.7); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.4); }
    .agency-isro { background: rgba(150,80,0,0.7);  color: #fcd34d; border: 1px solid rgba(245,158,11,0.4); }
    .agency-other{ background: rgba(50,50,80,0.7);  color: #cbd5e1; border: 1px solid rgba(100,116,139,0.4); }

    .type-rover        { border-left:3px solid #ef4444; }
    .type-telescope    { border-left:3px solid #facc15; }
    .type-station      { border-left:3px solid #10b981; }
    .type-interstellar { border-left:3px solid #eab308; }
    .type-lagrange     { border-left:3px solid #c084fc; }
    .type-lunar        { border-left:3px solid #94a3b8; }
    .type-generic      { border-left:3px solid rgba(255,255,255,0.2); }

    .mission-link:hover{
      background: rgba(37,99,235,0.35);
      color:white;
      border-color:rgba(147,197,253,0.5);
      transform:translateY(-2px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.3);
      z-index:150;
    }

/* ===== PLANET GLOW ===== */
.sun-glow {
  position: absolute;
  width: 12vh; height: 12vh;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255,180,0,1) 0%, rgba(255,100,0,0.9) 30%, rgba(255,50,0,0.5) 60%, transparent 100%);
  filter: blur(25px);
  pointer-events: none;
  animation: sunPulse 4s ease-in-out infinite;
}

.sun-body {
  width: 12vh; height: 12vh;
  background-image: url('sun.jpg');
  background-size: cover;
  background-position: center;
  border-radius: 50%;
  box-shadow: none;
-webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 61%);
mask-image: radial-gradient(circle at center, black 45%, transparent 61%);
}

@keyframes sunPulse {
  0%,100% { transform: translate(-50%,-50%) scale(1.4); opacity: 0.85; }
  50%      { transform: translate(-50%,-50%) scale(1.8); opacity: 1; }
}
    .sun-cluster{ left:-23vh; top:6vh; }

    .mercury-orbit{ width:45vh; height:45vh; }
    .mercury-node{ top:-17vh; left:14vh; }
    .mercury-body{ width:3vh; height:3vh; background-image:url('mercury.jpg'); }
    .mercury-cluster{ left:3vh; top:-4vh; }

    .earth-orbit{ width:110vh; height:110vh; }
    .earth-node{ top:22.5vh; left:50.5vh; z-index:60; }
    .earth-body{
      width:6vh; height:6vh; background-image:url('earth.jpg');
      box-shadow: inset -4px -4px 12px rgba(0,0,0,0.55), 0 0 25px rgba(30,100,255,0.3);
    }
    .earth-cluster{ left:-3vh; top:-29vh; }

    .moon-node{ top:29vh; left:69vh; z-index:61; }
    .moon-node-2{ top:27.5vh; left:46.5vh; z-index:61; }
    .moon-body{
      width:3vh; height:3vh; background-image:url('moon.jpg');
      box-shadow: inset -2px -2px 6px rgba(0,0,0,0.4), 0 0 8px rgba(255,255,255,0.2);
    }

    .lagrange-node-L1{ top:20vh; left:44vh; z-index:65; }
    .lagrange-node-L2{ top:27vh; left:57vh; z-index:65; }
    .lagrange-marker-L1, .lagrange-marker-L2{
      width:10px; height:10px; background:var(--lagrange-color);
      border-radius:50%;
      box-shadow:0 0 15px var(--lagrange-color), 0 0 30px rgba(192,132,252,0.3);
      animation: lagrangePulse 3s ease-in-out infinite;
    }
    @keyframes lagrangePulse {
      0%,100% { box-shadow: 0 0 12px var(--lagrange-color); }
      50%      { box-shadow: 0 0 25px var(--lagrange-color), 0 0 40px rgba(192,132,252,0.4); }
    }
    .lagrange-L1-cluster{ left:-30vh; top:-16vh; }
    .lagrange-L2-cluster{ left:2vh; top:-1vh; }

    .mars-orbit{ width:173vh; height:173vh; }
    .mars-node{ top:-10vh; left:86vh; z-index:70; }
    .mars-body{
      width:5vh; height:5vh; background-image:url('mars.jpg');
      box-shadow: inset -4px -4px 12px rgba(0,0,0,0.55), 0 0 20px rgba(188,64,79,0.25);
    }
    .mars-cluster{ left:4vh; top:-11vh; }

    .asteroid-dust-ring{
      position:absolute;
      top:0; left:0;
      width:200vh; height:200vh;
      pointer-events:none;
      transform: translate(-50%,-50%);
      animation: slowSpin 240s linear infinite;
    }
    @keyframes slowSpin{
      from{ transform: translate(-50%,-50%) rotate(0deg); }
      to{ transform: translate(-50%,-50%) rotate(-360deg); }
    }
    .asteroid-node{ top:100vh; left:33vh; z-index:68; }
    .asteroid-cluster{ left:-7vh; top:-14vh; }

    .jupiter-orbit{ width:220vh; height:220vh; }
    .jupiter-node{ top:35vh; left:105vh; }
    .jupiter-body{
      width:9vh; height:14vh; background-image:url('jupiter.png');
      border-radius:0; box-shadow:none;
      background-size:contain;
      background-repeat:no-repeat;
      background-position:center;
    }
    .jupiter-cluster{ left:6vh; top:-6vh; }

    .deepspace-node{ top:95vh; left:105vh; }
    .deepspace-cluster{ left:-4vh; top:-19vh; }

    /* ===== TIMELINE DOCK ===== */
    .timeline-dock{
      position:fixed;
      left:18px;
      right:18px;
      bottom:18px;
      z-index:9999;
      pointer-events:auto;
    }
    .timeline-card{
      background: rgba(2,6,23,0.90);
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 20px 50px rgba(0,0,0,0.6);
      border-radius:14px;
      backdrop-filter: blur(14px);
      padding:10px 12px 12px;
    }
    .timeline-mission-name {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: rgba(147,197,253,0.9);
      margin-bottom: 7px;
      text-transform: uppercase;
    }
    .timeline-bar{
      position:relative;
      height:75px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      overflow:hidden;
    }
    .timeline-ticks{
      position:absolute; inset:0;
      display:flex; justify-content:space-between;
      padding: 0 10px;
      align-items:flex-start;
    }
    .tick{ position:relative; height:100%; width:1px; background: rgba(255,255,255,0.07); }
    .tick-label{
      position:absolute; top:6px; left:50%;
      transform:translateX(-50%);
      font-size:11px;
      font-family: 'Orbitron', monospace;
      color: rgba(255,255,255,0.4);
      white-space:nowrap;
    }
    .events-layer{
      position:absolute;
      left:10px; right:10px; top:0; bottom:0;
    }
    .event-dot{
      position:absolute;
      top:26px;
      width:10px; height:10px;
      border-radius:50%;
      background: rgba(147,197,253,0.95);
      box-shadow: 0 0 18px rgba(147,197,253,0.55);
      transform: translateX(-50%);
      transition: transform 0.2s ease;
    }
    .event-dot:hover { transform: translateX(-50%) scale(1.4); }
    .event-dot.dot-start  { background: rgba(52,211,153,0.95); box-shadow: 0 0 14px rgba(52,211,153,0.5); }
    .event-dot.dot-end    { background: rgba(239,68,68,0.95);  box-shadow: 0 0 14px rgba(239,68,68,0.5); }
    .event-dot.dot-flyby  { background: rgba(250,204,21,0.95); box-shadow: 0 0 14px rgba(250,204,21,0.5); }
    .event-label{
      position:absolute;
      top:56px;
      font-size:11px;
      color: rgba(255,255,255,0.8);
      white-space: nowrap;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translateX(0);
    }
    .mission-span-track{
      position:absolute;
      left:0; right:0;
      top:28px;
      height:6px;
      border-radius:999px;
      background: rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.07);
    }
    .mission-span-bar{
      position:absolute;
      top:29px;
      height:4px;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(52,211,153,0.7), rgba(147,197,253,0.7), rgba(239,68,68,0.7));
      box-shadow: 0 0 18px rgba(147,197,253,0.2);
    }
    /* Progress overlay on span bar */
    .mission-progress-bar {
      position: absolute;
      top: 29px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      pointer-events: none;
    }
    .now-line{
      position:absolute;
      top:18px; bottom:12px;
      width:2px;
      background: rgba(239,68,68,0.9);
      box-shadow: 0 0 18px rgba(239,68,68,0.5);
      transform: translateX(-50%);
      pointer-events:none;
    }
    .now-cap{
      position:absolute;
      top:58px;
      transform: translateX(-50%);
      font-size:10px;
      font-family: 'Orbitron', monospace;
      font-weight:700;
      color: rgba(239,68,68,0.9);
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      pointer-events:none;
      letter-spacing: 0.05em;
    }
    .timeline-hidden{ opacity:0; transform: translateY(8px); transition: opacity .18s ease, transform .18s ease; pointer-events:none; }
    .timeline-shown{ opacity:1; transform: translateY(0); transition: opacity .18s ease, transform .18s ease; }

    /* Progress percent label */
    .progress-label {
      font-size: 10px;
      color: rgba(147,197,253,0.7);
      margin-left: auto;
      font-family: 'Orbitron', monospace;
    }
    .timeline-header {
      display: none;
      align-items: center;
      margin-bottom: 7px;
    }

    /* ===== INFO PANEL ===== */
    .info-panel{
      position:absolute;
      z-index:10001;
      width:min(520px, calc(100vw - 36px));
      pointer-events:none;
    }
    .info-card{
      background: rgba(8,18,50,0.95);
      border: 1px solid rgba(147,197,253,0.2);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 55px rgba(0,0,0,0.7), 0 0 0 1px rgba(147,197,253,0.05);
      padding: 14px 16px;
    }
    .info-head{
      display:flex;
      align-items:baseline;
      gap:10px;
      margin-bottom:8px;
    }
    .info-title{
      font-family: 'Orbitron', monospace;
      font-weight:700;
      font-size:13px;
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.05em;
    }
    .info-sub{
      font-size:11px;
      color: rgba(147,197,253,0.7);
      font-weight:500;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 340px;
    }
    .info-text{
      font-size:13.5px;
      line-height:1.45;
      color: rgba(255,255,255,0.78);
      margin:0;
      max-height: 9.5em;
      overflow:auto;
      padding-right: 6px;
    }
    .info-hidden{ opacity:0; transform: translateY(6px); transition: opacity .15s ease, transform .15s ease; }
    .info-shown{ opacity:1; transform: translateY(0); transition: opacity .15s ease, transform .15s ease; }

    .main-by{
      font-size: 12px;
      font-weight: 400;
      margin-left: 10px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-family: 'Inter', sans-serif;
    }
    .main-by:hover{ color: rgba(255,255,255,0.75); text-decoration: underline; }

    .flag-counter-wrap{
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 9998;
      background: rgba(2,6,23,0.75);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 8px 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      line-height: 0;
    }
    .flag-counter-wrap img{ border-radius: 6px; display: block; }

    /* ===== MOBILE VIEW ===== */
    @media (max-width: 768px) {
      body { overflow: auto; height: auto; min-height: 100vh; }
      .universe-stage { display: none; }
      #nebula { display: none; }

      .mobile-view {
        display: flex !important;
        flex-direction: column;
        gap: 0;
        padding: 60px 12px 160px;
        min-height: 100vh;
      }

      h1.main-title {
        position: fixed;
        bottom: auto;
        top: 0; left: 0; right: 0;
        font-size: 13px;
        padding: 12px 14px;
        background: rgba(2,6,23,0.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        z-index: 10001;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .topbar { top: auto; bottom: 80px; right: 12px; }

      .timeline-dock {
        bottom: 0;
        left: 0; right: 0;
        border-radius: 0;
      }
      .timeline-card { border-radius: 0; border-left: none; border-right: none; border-bottom: none; }

      .flag-counter-wrap { display: none; }

      /* Mobile section cards */
      .mobile-section {
        margin-bottom: 8px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(8,16,40,0.9);
        backdrop-filter: blur(10px);
      }
      .mobile-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        cursor: pointer;
        user-select: none;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.03);
      }
      .mobile-section-title {
        font-family: 'Orbitron', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.85);
        text-transform: uppercase;
      }
      .mobile-section-count {
        font-size: 10px;
        color: rgba(147,197,253,0.7);
        background: rgba(37,99,235,0.2);
        padding: 2px 7px;
        border-radius: 10px;
        border: 1px solid rgba(37,99,235,0.3);
      }
      .mobile-section-chevron {
        font-size: 12px;
        color: rgba(255,255,255,0.4);
        transition: transform 0.2s ease;
        margin-left: 8px;
      }
      .mobile-section.open .mobile-section-chevron { transform: rotate(180deg); }
      .mobile-section-body {
        display: none;
        padding: 10px;
        flex-direction: column;
        gap: 5px;
      }
      .mobile-section.open .mobile-section-body { display: flex; }

      .mobile-section.earth-panel { border-color: rgba(10,130,230,0.3); }
      .mobile-section.mars-panel  { border-color: rgba(188,64,79,0.3); }
      .mobile-section.lagrange-panel { border-color: rgba(192,132,252,0.3); }
      .mobile-section.lunar-panel { border-color: rgba(148,163,184,0.3); }

      .mission-link { font-size: 13px; padding: 8px 10px; }
    }

    @media (min-width: 769px) {
      .mobile-view { display: none !important; }
    }
  </style>
</head>

<body>
  <!-- Starfield -->
  <div id="starfield"></div>
  <div id="nebula"></div>

  <h1 class="main-title">
    Active Space Missions Dashboard (May 2026)
    <span class="mission-count-badge" id="missionCountBadge">— missions</span>
    <!--<a class="main-by" href="mailto:paolo.sirtoli@gmail.com">by Paolo Sirtoli</a>-->
  </h1>

  <div class="topbar">
    <label for="langSelect">Language</label>
    <select id="langSelect">
      <option value="it">IT</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="de">DE</option>
      <option value="fr">FR</option>
      <option value="pt">PT</option>
    </select>
  </div>

  <!-- INFO PANEL -->
  <div id="infoPanel" class="info-panel info-hidden" aria-live="polite">
    <div class="info-card">
      <div class="info-head">
        <div id="infoTitle" class="info-title">—</div>
        <div id="infoSub" class="info-sub">—</div>
      </div>
      <p id="infoText" class="info-text">—</p>
    </div>
  </div>

  <!-- TIMELINE -->
  <div id="timelineDock" class="timeline-dock timeline-hidden" aria-live="polite">
    <div class="timeline-card">
      <div class="timeline-header">
        <div class="timeline-mission-name" id="tlMissionName">—</div>
        <div class="progress-label" id="tlProgressLabel"></div>
      </div>
      <div class="timeline-bar">
        <div class="timeline-ticks" id="tlTicks"></div>
        <div class="events-layer" id="tlSpan"></div>
        <div class="events-layer" id="tlEvents"></div>
      </div>
    </div>
  </div>

  <!-- DESKTOP: 3D solar system -->
  <div class="universe-stage">
    <div class="solar-plane">
      <div class="orbit-ring mercury-orbit"></div>
      <div class="orbit-ring earth-orbit"></div>
      <div class="orbit-ring mars-orbit"></div>
      <div class="asteroid-dust-ring"></div>
      <div class="orbit-ring jupiter-orbit"></div>

      <div class="orbit-node sun-node">
		<div class="sun-glow"></div>
		<div class="celestial-body sun-body"></div>
        <div class="planet-label" style="left:-1vh; top:-9vh;">Sun</div>
        <div id="cluster-sun" class="mission-cluster col-cluster sun-cluster"></div>
      </div>
      <div class="orbit-node mercury-node">
        <div class="celestial-body mercury-body"></div>
        <div class="planet-label" style="left:-5vh; top:-4vh;">Mercury</div>
        <div id="cluster-mercury" class="mission-cluster col-cluster mercury-cluster"></div>
      </div>
      <div class="orbit-node earth-node">
        <div class="celestial-body earth-body"></div>
        <div class="planet-label" style="left:2.5vh; top:-4vh;">Earth</div>
        <div id="cluster-earth" class="mission-cluster grid-cluster earth-cluster earth-panel"></div>
      </div>
      <div class="orbit-node moon-node-2">
        <div class="celestial-body moon-body"></div>
        <div class="planet-label" style="left:-35vh; top:-0.5vh; color:#cbd5e1; font-size:10px;">Moon Lagrange / DRO</div>
        <div id="cluster-moon-drol1" class="mission-cluster col-cluster lunar-panel" style="left:-38vh; top:2vh;"></div>
      </div>
      <div class="orbit-node moon-node">
        <div class="planet-label" style="left:-30vh; top:-0.5vh; color:#cbd5e1; font-size:10px;">Moon</div>
        <div id="cluster-moon" class="mission-cluster col-cluster lunar-panel" style="left:-38vh; top:2vh;"></div>
      </div>
      <div class="orbit-node lagrange-node-L1">
        <div class="celestial-body lagrange-marker-L1"></div>
        <div class="planet-label lagrange-title" style="left:-1vh; top:-3vh;">L1</div>
        <div id="cluster-l1" class="mission-cluster grid-cluster lagrange-L1-cluster lagrange-panel"></div>
      </div>
      <div class="orbit-node lagrange-node-L2">
        <div class="celestial-body lagrange-marker-L2"></div>
        <div class="planet-label lagrange-title" style="left:-1vh; top:-3vh;">L2</div>
        <div id="cluster-l2" class="mission-cluster col-cluster lagrange-L2-cluster lagrange-panel"></div>
      </div>
      <div class="orbit-node mars-node">
        <div class="celestial-body mars-body"></div>
        <div class="planet-label" style="left:-3vh; top:-5vh;">Mars</div>
        <div id="cluster-mars" class="mission-cluster grid-cluster mars-cluster mars-panel"></div>
      </div>
      <div class="orbit-node asteroid-node">
        <div class="planet-label" style="left:-20vh; top:-5vh; color:#94a3b8;">Asteroid Belt</div>
        <div id="cluster-asteroids" class="mission-cluster grid-cluster asteroid-cluster"></div>
      </div>
      <div class="orbit-node jupiter-node">
        <div class="celestial-body jupiter-body"></div>
        <div class="planet-label" style="left:-2vh; top:-9vh;">Jupiter</div>
        <div id="cluster-jupiter" class="mission-cluster col-cluster jupiter-cluster"></div>
      </div>
      <div class="orbit-node deepspace-node">
        <div class="planet-label" style="left:-6vh; top:-4vh; color:#eab308;">Beyond the Solar System</div>
        <div id="cluster-deepspace" class="mission-cluster col-cluster deepspace-cluster"></div>
      </div>
    </div>
  </div>

  <!-- MOBILE: accordion list -->
  <div class="mobile-view" id="mobileView" style="display:none;"></div>

  <!-- Flag Counter -->
  <div class="flag-counter-wrap">
    <a href="https://info.flagcounter.com/C5s8">
      <img src="https://s01.flagcounter.com/count/C5s8/bg_020617/txt_94A3B8/border_000000/columns_2/maxflags_10/viewers_0/labels_1/pageviews_0/flags_0/percent_1/" alt="Flag Counter" border="0">
    </a>
  </div>

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>
  <script src="./missions.js"></script>

  <script>
  (function(){
    const DASH = window.DASH_DATA;
    if (!DASH || !Array.isArray(DASH.missions)) {
      console.error("DASH_DATA non trovato o invalido.");
      return;
    }

    const SUPPORTED_LANGS = ["it","en","es","pt","fr","de"];
    let CURRENT_LANG = "en";

    const dock         = document.getElementById("timelineDock");
    const tlTicks      = document.getElementById("tlTicks");
    const tlSpan       = document.getElementById("tlSpan");
    const tlEvents     = document.getElementById("tlEvents");
    const tlMissionName= document.getElementById("tlMissionName");
    const tlProgressLabel = document.getElementById("tlProgressLabel");
    const infoPanel    = document.getElementById("infoPanel");
    const infoTitle    = document.getElementById("infoTitle");
    const infoSub      = document.getElementById("infoSub");
    const infoText     = document.getElementById("infoText");
    const langSelect   = document.getElementById("langSelect");
    const missionCountBadge = document.getElementById("missionCountBadge");

    const START_YEAR = DASH.scale.startYear;
    const END_YEAR   = DASH.scale.endYear;

    let hideTimer    = null;
    let activeAnchor = null;

    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

    function pickSupported(lang2){
      const l = String(lang2||"").slice(0,2).toLowerCase();
      return SUPPORTED_LANGS.includes(l) ? l : null;
    }

    async function detectLanguage(){
      const saved = localStorage.getItem("lang");
      if (saved && SUPPORTED_LANGS.includes(saved)) return saved;
      try{
        const ctrl = new AbortController();
        const t = setTimeout(()=>ctrl.abort(), 900);
        const r = await fetch("https://ipapi.co/json/", { signal: ctrl.signal });
        clearTimeout(t);
        if (r.ok){
          const j = await r.json();
          const cc = String(j.country_code||"").toUpperCase();
          const map = {IT:"it",US:"en",GB:"en",IE:"en",ES:"es",MX:"es",AR:"es",CO:"es",PT:"pt",BR:"pt",FR:"fr",BE:"fr",CH:"fr",CA:"en",DE:"de",AT:"de"};
          if (map[cc]) return map[cc];
        }
      }catch(_){}
      return pickSupported(navigator.language) || "en";
    }

    function getSummary(m){
      const s = m && m.summaries ? m.summaries : null;
      if (!s) return "";
      return s[CURRENT_LANG] || s["en"] || "";
    }

    function typeToClass(type){
      switch(String(type||"").toLowerCase()){
        case "rover":        return "type-rover";
        case "telescope":    return "type-telescope";
        case "station":      return "type-station";
        case "interstellar": return "type-interstellar";
        case "lagrange":     return "type-lagrange";
        case "lunar":        return "type-lunar";
        default:             return "type-generic";
      }
    }

    function agencyBadge(agency){
      if (!agency) return "";
      const a = agency.toUpperCase();
      let cls = "agency-other";
      if (a.includes("NASA")) cls = "agency-nasa";
      else if (a.includes("ESA")) cls = "agency-esa";
      else if (a.includes("CNSA")) cls = "agency-cnsa";
      else if (a.includes("JAXA")) cls = "agency-jaxa";
      else if (a.includes("ISRO")) cls = "agency-isro";
      return `<span class="agency-badge ${cls}">${agency}</span>`;
    }

    /* ===== STARFIELD GENERATION ===== */
    (function generateStars(){
      const sf = document.getElementById("starfield");
      const count = 100;
      for (let i=0; i<count; i++){
        const star = document.createElement("div");
        star.className = "star";
        const size = Math.random() * 2.2 + 0.4;
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const dur = (2.5 + Math.random() * 5).toFixed(1);
        const delay = (Math.random() * 6).toFixed(1);
        const minOp = (0.1 + Math.random() * 0.2).toFixed(2);
        const maxOp = (0.6 + Math.random() * 0.4).toFixed(2);
        star.style.cssText = `
          width:${size}px; height:${size}px;
          left:${x}%; top:${y}%;
          --dur:${dur}s; --delay:-${delay}s;
          --min-op:${minOp}; --max-op:${maxOp};
        `;
        sf.appendChild(star);
      }
    })();

    /* ===== ASTEROID RING ===== */
    (function generateAsteroids(){
      const ring = document.querySelector(".asteroid-dust-ring");
      if (!ring) return;
      const count = 380;
      for (let i=0; i<count; i++){
        const a = Math.random() * Math.PI * 2;
        const r = 90 + Math.random() * 15;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        const dot = document.createElement("div");
        dot.style.cssText = `
          position:absolute;
          left:${100+x}vh; top:${100+y}vh;
          width:${(Math.random()*1.8+0.9)}px;
          height:${(Math.random()*1.8+0.9)}px;
          border-radius:50%;
          background:rgba(200,200,200,${0.5+Math.random()*0.5});
        `;
        ring.appendChild(dot);
      }
    })();

    /* ===== TIMELINE HELPERS ===== */
    function yearToPercent(yFloat){
      const y = clamp(yFloat, START_YEAR, END_YEAR);
      return ((y - START_YEAR) / (END_YEAR - START_YEAR)) * 100;
    }

    function parseDateToFraction(dateStr){
      const raw = String(dateStr ?? "").trim();
      if (!raw) return null;
      const s = raw.replace(/[–—]/g,'-').replace(/[\/\.]/g,'-');
      const m = s.match(/^(\d{4})(?:-(\d{1,2})(?:-(\d{1,2}))?)?$/);
      if (!m) return null;
      const y = parseInt(m[1],10);
      const mo = m[2] ? parseInt(m[2],10) : 1;
      const da = m[3] ? parseInt(m[3],10) : 1;
      const frac = (clamp(mo,1,12)-1)/12 + (clamp(da,1,31)-1)/365;
      const out = y + frac;
      return Number.isFinite(out) ? out : null;
    }

    function nowToYearFloat(){
      const now = new Date();
      const y = now.getFullYear();
      const start = new Date(y,0,1);
      const end   = new Date(y+1,0,1);
      return y + (now - start)/(end - start);
    }

    function dotClass(type, label){
      const t = String(type||"").toLowerCase();
      const l = String(label||"").toLowerCase();
      if (t === "start" || /launch/i.test(l)) return "dot-start";
      if (t === "end"   || /(fine|end|decommission)/i.test(l)) return "dot-end";
      if (/flyby|fly-by/i.test(l)) return "dot-flyby";
      return "";
    }

    function drawNowLine(){
      const yNow = nowToYearFloat();
      const x = yearToPercent(yNow);
      const line = document.createElement("div");
      line.className = "now-line";
      line.style.left = x + "%";
      const cap = document.createElement("div");
      cap.className = "now-cap";
      cap.style.left = x + "%";
      cap.textContent = ({it:"OGGI",es:"HOY",pt:"HOJE",fr:"AUJ.",de:"Heute"})[CURRENT_LANG] || "TODAY";
      tlSpan.appendChild(line);
      tlSpan.appendChild(cap);
    }

    function buildTicks(){
      tlTicks.innerHTML = "";
      const years = [];
      for (let y=START_YEAR; y<=END_YEAR; y+=2) years.push(y);
      years.forEach(y=>{
        const t = document.createElement("div");
        t.className = "tick";
        const lab = document.createElement("div");
        lab.className = "tick-label";
        lab.textContent = String(y);
        t.appendChild(lab);
        tlTicks.appendChild(t);
      });
    }

    function showTimeline(mission){
      tlSpan.innerHTML = "";
      tlEvents.innerHTML = "";
      drawNowLine();

      const mLabel = mission.label || mission.name || "";
      tlMissionName.textContent = mLabel;

      const events = Array.isArray(mission.events) ? mission.events : [];
      const parsed = events.map(e=>({
        date: String(e.date||""),
        label: String(e.label||""),
        type: String(e.type||""),
        yFloat: parseDateToFraction(e.date)
      })).filter(e=>e.yFloat !== null && e.label).sort((a,b)=>a.yFloat-b.yFloat);

      const inRange = parsed.filter(e=>e.yFloat>=START_YEAR && e.yFloat<=END_YEAR);

      const startEv = parsed.find(e=>e.type==="start")||parsed.find(e=>/launch/i.test(e.label))||parsed[0];
      const endEv   = [...parsed].reverse().find(e=>e.type==="end")||[...parsed].reverse().find(e=>/(fine|end|decommission)/i.test(e.label))||null;

      if (startEv){
        const rawStart = startEv.yFloat;
        const rawEnd   = endEv ? endEv.yFloat : END_YEAR;
        const x1 = yearToPercent(clamp(rawStart, START_YEAR, END_YEAR));
        const x2 = yearToPercent(clamp(rawEnd,   START_YEAR, END_YEAR));
        const left  = Math.min(x1,x2);
        const right = Math.max(x1,x2);

        const track = document.createElement("div");
        track.className = "mission-span-track";
        const bar = document.createElement("div");
        bar.className = "mission-span-bar";
        bar.style.left  = left + "%";
        bar.style.width = (right-left) + "%";
        tlSpan.appendChild(track);
        tlSpan.appendChild(bar);

        // Progress overlay
        const yNow = nowToYearFloat();
        if (yNow > rawStart){
          const total = rawEnd - rawStart;
          const elapsed = Math.min(yNow, rawEnd) - rawStart;
          const pct = total > 0 ? Math.round((elapsed/total)*100) : 0;
          const progX = yearToPercent(clamp(Math.min(yNow,rawEnd), START_YEAR, END_YEAR));
          const prog = document.createElement("div");
          prog.className = "mission-progress-bar";
          prog.style.left  = left + "%";
          prog.style.width = (progX - left) + "%";
          tlSpan.appendChild(prog);
          //tlProgressLabel.textContent = `${pct}% elapsed`;
        } else {
          tlProgressLabel.textContent = "";
        }
      } else {
        tlProgressLabel.textContent = "";
      }

      inRange.forEach((e,idx)=>{
        const x = yearToPercent(e.yFloat);
        const dot = document.createElement("div");
        dot.className = "event-dot " + dotClass(e.type, e.label);
        dot.style.left = x + "%";
        const lab = document.createElement("div");
        lab.className = "event-label";
        lab.style.left = x + "%";
        lab.textContent = e.label;
        lab.style.transform = `translateY(${(idx%3)*10-20}px)`;
        tlEvents.appendChild(dot);
        tlEvents.appendChild(lab);
      });

      dock.classList.remove("timeline-hidden");
      dock.classList.add("timeline-shown");
    }

    function hideTimeline(){
      dock.classList.remove("timeline-shown");
      dock.classList.add("timeline-hidden");
      tlSpan.innerHTML = "";
      tlEvents.innerHTML = "";
    }

    /* ===== INFO PANEL ===== */
    function positionInfoNearAnchor(anchorEl){
      if (!anchorEl || !infoPanel) return;
      infoPanel.classList.remove("info-hidden");
      infoPanel.classList.add("info-shown");
      const r  = anchorEl.getBoundingClientRect();
      const pw = infoPanel.offsetWidth;
      const ph = infoPanel.offsetHeight;
      const margin = 12;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let left = r.right + margin;
      let top  = r.top - 6;
      if (left + pw + margin > vw) left = r.left - pw - margin;
      left = Math.max(margin, Math.min(left, vw-pw-margin));
      if (top + ph + margin > vh) top = vh - ph - margin;
      if (top < margin) top = margin;
      infoPanel.style.left = left + "px";
      infoPanel.style.top  = top  + "px";
    }

    function showInfo(mission){
      infoTitle.textContent = mission.label || mission.name || "—";
      infoSub.textContent   = "";
      infoText.textContent  = getSummary(mission) || "—";
      infoPanel.classList.remove("info-hidden");
      infoPanel.classList.add("info-shown");
      if (activeAnchor) positionInfoNearAnchor(activeAnchor);
    }

    function hideInfo(){
      infoPanel.classList.remove("info-shown");
      infoPanel.classList.add("info-hidden");
    }

    function scheduleHide(){
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(()=>{ activeAnchor=null; hideTimeline(); hideInfo(); }, 160);
    }
    function cancelHide(){
      if (hideTimer){ clearTimeout(hideTimer); hideTimer=null; }
    }

    dock.addEventListener("mouseenter", cancelHide);
    dock.addEventListener("mouseleave", scheduleHide);

    /* ===== BUILD MISSIONS (desktop) ===== */
    function createMissionLink(m){
      const a = document.createElement("a");
      a.href = m.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = `mission-link ${typeToClass(m.type)}`;
      if (m.agency) {
        a.innerHTML = agencyBadge(m.agency) + (m.label || m.name || m.id);
      } else {
        a.textContent = m.label || m.name || m.id;
      }
      a.__mission = m;
      a.addEventListener("mouseenter", ()=>{
        cancelHide();
        activeAnchor = a;
        showTimeline(m);
        showInfo(m);
      });
      a.addEventListener("mouseleave", scheduleHide);
      return a;
    }

    function buildMissions(){
      Object.values(DASH.clusters).forEach(cluster=>{
        const el = document.getElementById(cluster.elementId);
        if (el) el.innerHTML = "";
      });
      DASH.missions.forEach(m=>{
        const cluster = DASH.clusters[m.cluster];
        const container = cluster && document.getElementById(cluster.elementId);
        if (!container) return;

        // Add cluster title header if first child
        if (container.children.length === 0 && m.clusterLabel){
          const title = document.createElement("div");
          title.className = "cluster-title";
          title.style.gridColumn = "1 / -1";
          title.textContent = m.clusterLabel;
          container.appendChild(title);
        }

        container.appendChild(createMissionLink(m));
      });
      // Update count badge
      missionCountBadge.textContent = DASH.missions.length + " missions";
    }

    /* ===== BUILD MOBILE VIEW ===== */
    function buildMobileView(){
      const mobileView = document.getElementById("mobileView");
      mobileView.innerHTML = "";

      // Group by cluster
      const groups = {};
      const groupOrder = [];
      DASH.missions.forEach(m=>{
        const key = m.cluster || "other";
        if (!groups[key]){ groups[key]=[]; groupOrder.push(key); }
        groups[key].push(m);
      });

      groupOrder.forEach((key,gi)=>{
        const missions = groups[key];
        const cluster = DASH.clusters[key];
        const section = document.createElement("div");
        section.className = "mobile-section " + (cluster?.panelClass||"");
        if (gi === 0) section.classList.add("open");

        const header = document.createElement("div");
        header.className = "mobile-section-header";
        header.innerHTML = `
          <span class="mobile-section-title">${cluster?.label||key}</span>
          <span style="display:flex;align-items:center;gap:6px;">
            <span class="mobile-section-count">${missions.length}</span>
            <span class="mobile-section-chevron">▼</span>
          </span>
        `;
        header.addEventListener("click", ()=>{
          section.classList.toggle("open");
        });

        const body = document.createElement("div");
        body.className = "mobile-section-body";
        missions.forEach(m=>{
          const a = createMissionLink(m);
          // On mobile: tap shows timeline at bottom
          a.addEventListener("click", e=>{
            if (window.innerWidth <= 768){
              e.preventDefault();
              activeAnchor = a;
              showTimeline(m);
              showInfo(m);
              // Tap again opens link
              a.dataset.tapped = "1";
              setTimeout(()=>{ delete a.dataset.tapped; }, 1500);
            }
          });
          body.appendChild(a);
        });
        section.appendChild(header);
        section.appendChild(body);
        mobileView.appendChild(section);
      });
    }

    /* ===== INIT ===== */
    async function init(){
      CURRENT_LANG = await detectLanguage();
      langSelect.value = CURRENT_LANG;
      buildTicks();
      buildMissions();
      buildMobileView();
      hideTimeline();
      hideInfo();
    }

    langSelect.addEventListener("change", ()=>{
      CURRENT_LANG = langSelect.value;
      localStorage.setItem("lang", CURRENT_LANG);
      if (activeAnchor && activeAnchor.__mission){
        showTimeline(activeAnchor.__mission);
        showInfo(activeAnchor.__mission);
        positionInfoNearAnchor(activeAnchor);
      }
    });

    window.addEventListener("resize", ()=>{
      if (activeAnchor) positionInfoNearAnchor(activeAnchor);
    });

    init();
  })();
  </script>
</body>
